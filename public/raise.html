  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);color:var(--papyrus);font-family:var(--body);line-height:1.55;
    overflow:hidden;-webkit-text-size-adjust:100%;
    background-image:
      radial-gradient(120% 80% at 50% -10%, rgba(150,222,240,.10), transparent 60%),
      radial-gradient(90% 60% at 50% 110%, rgba(138,108,255,.10), transparent 60%);
  }

  .stage{position:fixed;inset:0;overflow:hidden}

  /* ---- scenes ---- */
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:clamp(2.6rem,7vw,7rem) clamp(1.4rem,6vw,6rem) clamp(5.5rem,10vh,7rem);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease;overflow-y:auto}
  .scene.active{opacity:1;visibility:visible;pointer-events:auto}
  .wrap{width:100%;max-width:1040px;margin:auto}

  .eyebrow{font-family:var(--data);font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--gold);display:flex;align-items:center;gap:.9rem;margin-bottom:clamp(1.1rem,3vw,2rem)}
  .eyebrow::after{content:"";height:1px;flex:1;max-width:120px;background:linear-gradient(90deg,var(--bronze),transparent)}

  h1,h2,.motto{font-family:var(--display);font-weight:900;text-transform:uppercase;
    line-height:.94;letter-spacing:-.01em;text-wrap:balance;color:var(--papyrus)}
  h1{font-size:clamp(2.9rem,10vw,7.2rem)}
  h2{font-size:clamp(2.1rem,6.4vw,4.6rem)}
  .motto{font-size:clamp(3rem,11vw,8.4rem);line-height:.9}
  .gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lead{font-size:clamp(1.05rem,2.1vw,1.4rem);color:var(--papyrus-dim);max-width:60ch;margin-top:clamp(1.2rem,3vw,2rem)}
  .lead strong{color:var(--papyrus);font-weight:600}
  .subhero{margin-top:1.6rem;font-family:var(--data);font-size:.86rem;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:clamp(1.6rem,4vw,2.6rem);background:var(--hair);border:1px solid var(--hair)}
  .stat{background:var(--ink);padding:clamp(1.2rem,3vw,2rem) clamp(1rem,2.5vw,1.6rem)}
  .stat .num{font-family:var(--data);font-variant-numeric:tabular-nums;font-size:clamp(1.7rem,5vw,3.2rem);font-weight:600;color:var(--gold);line-height:1}
  .stat .lbl{font-family:var(--data);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--papyrus-dim);margin-top:.7rem}
  .fill{border-bottom:2px dashed var(--bronze);color:var(--bronze);padding-bottom:.05em}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .note{margin-top:1.3rem;font-family:var(--data);font-size:.8rem;letter-spacing:.05em;color:var(--bronze)}

  .perks{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:clamp(1.4rem,3.4vw,2.2rem)}
  .perk{border:1px solid var(--hair);padding:clamp(1.1rem,2.6vw,1.6rem);background:linear-gradient(180deg,rgba(150,222,240,.05),transparent)}
  .perk .k{font-family:var(--data);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem}
  .perk .t{font-family:var(--display);text-transform:uppercase;font-size:1.1rem;line-height:1.05;margin-bottom:.45rem}
  .perk .d{font-size:.92rem;color:var(--papyrus-dim)}
  @media(max-width:720px){.perks{grid-template-columns:1fr;gap:.7rem}.perk .d{font-size:.86rem}}
  .duo{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:clamp(1.2rem,3vw,1.8rem);max-width:860px}
  @media(max-width:720px){.duo{grid-template-columns:1fr;gap:.7rem}}

  /* ---- roadmap ---- */
  .roadmap{display:flex;flex-direction:column;margin-top:clamp(1.1rem,2.8vw,1.9rem)}
  .rm{padding:clamp(.55rem,1.5vw,.9rem) 0;border-bottom:1px solid var(--hair)}
  .rm:last-child{border-bottom:0}
  .rm .top{display:flex;align-items:baseline;gap:.9rem}
  .rm .rk{font-family:var(--data);font-size:.8rem;letter-spacing:.14em;color:var(--gold);min-width:2ch}
  .rm .rt{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.02rem,2.3vw,1.5rem);line-height:1.02}
  .rm .rd{font-size:clamp(.85rem,1.6vw,1.02rem);color:var(--papyrus-dim);margin-top:.28rem;padding-left:calc(2ch + .9rem)}
  @media(max-width:720px){.rm .rd{padding-left:0}}

  /* ---- already built ---- */
  .built{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:clamp(1.1rem,2.8vw,1.9rem);max-width:920px}
  .chip{font-family:var(--data);font-size:clamp(.72rem,1.5vw,.9rem);letter-spacing:.03em;color:var(--papyrus);
    border:1px solid var(--hair);border-radius:999px;padding:.5rem .9rem;
    background:linear-gradient(180deg,rgba(150,222,240,.06),transparent)}
  .builtnote{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.05rem,2.8vw,1.9rem);
    color:var(--gold);margin-top:clamp(1.2rem,3vw,2rem);line-height:1.05;text-wrap:balance}

  .cta{display:inline-flex;align-items:center;gap:.8rem;margin-top:clamp(1.4rem,3.4vw,2.2rem);
